name: CI

on:
  push:
    branches:
    - master
  pull_request:
    branches:
    - master

permissions: {}

jobs:
  Test:
    name: Test - ${{ matrix.toolchain }} toolchain, ${{ matrix.dep }} deps
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        toolchain: [stable, msrv, nightly]
        dep: [minimal, recent]
    steps:
      - name: "Checkout repo"
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: "Install cargo-rbmt"
        uses: rust-bitcoin/rust-bitcoin-maintainer-tools/actions/setup-rbmt@1e8fea9234a597a3397326a539d2e3044938900d
      - name: "Run tests"
        run: cargo rbmt test --toolchain ${{ matrix.toolchain }} --lock-file ${{ matrix.dep }}

  Check:
    name: Check - ${{ matrix.task }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        task: [lint, docs]
    steps:
      - name: "Checkout repo"
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: "Install cargo-rbmt"
        uses: rust-bitcoin/rust-bitcoin-maintainer-tools/actions/setup-rbmt@1e8fea9234a597a3397326a539d2e3044938900d
      - name: "Run ${{ matrix.task }}"
        run: cargo rbmt ${{ matrix.task }}

  Format:
    name: Format - nightly toolchain
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: "Checkout repo"
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: "Install cargo-rbmt"
        uses: rust-bitcoin/rust-bitcoin-maintainer-tools/actions/setup-rbmt@1e8fea9234a597a3397326a539d2e3044938900d
      - name: "Check formatting"
        run: cargo rbmt fmt --check

  Arch32bit:
    name: Test 32-bit version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: "Checkout repo"
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: "Select toolchain"
        uses: dtolnay/rust-toolchain@stable
      - name: "Add architecture i386"
        run: sudo dpkg --add-architecture i386
      - name: "Install i686 gcc"
        run: sudo apt-get update -y && sudo apt-get install -y gcc-multilib
      - name: "Install target"
        run: rustup target add i686-unknown-linux-gnu
      - name: "Run test on i686"
        run: cargo test --target i686-unknown-linux-gnu
